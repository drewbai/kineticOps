<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>

    <!-- Favicon links -->
    <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="any">
    <!-- Optional PNG variant if you also provide it -->
    <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
    <!-- Optional Apple touch icon -->
    <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">

  </head>
  <body>
    {{ content }}
  </body>
</html>
