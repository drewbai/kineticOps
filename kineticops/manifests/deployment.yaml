apiVersion: apps/v1
kind: Deployment
metadata:
  name: kineticops-nginx
  labels:
    app: kineticops-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kineticops-nginx
  template:
    metadata:
      labels:
        app: kineticops-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          ports:
            - containerPort: 80
